name: "\U0001F41B Bug Report"
description: Report a problem with the ai-policy.dev website
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report! Please fill out this form as completely as possible.
  - type: input
    id: page
    attributes:
      label: Which page did you find the bug on?
      placeholder: https://ai-policy.dev/...
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: bug-reproduction
    attributes:
      label: Steps to reproduce
      description: How can we see the bug ourselves?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: What browser and operating system are you using?
      placeholder: Firefox on Linux, Safari on iOS
    validations:
      required: false
  - type: checkboxes
    id: will-pr
    attributes:
      label: Participation
      options:
        - label: I am willing to submit a pull request for this issue.
          required: false
